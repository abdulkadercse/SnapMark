name: snapmark
description: "Offline-first Desktop Screenshot & Annotation Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Desktop Window & Tray Management
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  tray_manager: ^0.2.4
  hotkey_manager: ^0.2.3

  # Image & Clipboard Processing
  image: ^4.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  pasteboard: ^0.4.0

  # Offline Storage (Local File & Preferences)
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.1.4
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
